<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Served from lockdown://app, so 'self' is a real origin here. blob: is
       for the pdf.js worker; lockdown: is for the session files themselves. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' blob:;
                 style-src 'self';
                 img-src 'self' data: blob:;
                 media-src 'self' lockdown: blob:;
                 connect-src 'self' lockdown: blob: data:;
                 worker-src 'self' blob:;
                 font-src 'self' data:;">
  <title>DeepWork</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lockdown.css">
</head>
<body>

  <!-- ============================= Home ============================= -->
  <main id="home" class="home">
    <div class="home-inner">
      <h1 class="home-title">DeepWork</h1>
      <p class="home-sub">Choose something to open.</p>
      <ul id="homeList" class="home-list"></ul>
    </div>
    <p class="stage-hint">Press &#8984;Q to exit</p>
  </main>

  <!-- ============================ Viewer ============================ -->
  <section id="viewer" class="viewer" hidden>
    <header class="bar">
      <button id="homeButton" class="bar-button" type="button">Home</button>

      <p id="viewerTitle" class="bar-title"></p>

      <div id="pageControls" class="pager" hidden>
        <input
          id="pageInput"
          class="pager-input"
          type="text"
          inputmode="numeric"
          size="4"
          maxlength="5"
          value="1"
          aria-label="Page number"
          autocomplete="off"
          spellcheck="false">
        <span id="pageTotal" class="pager-total"></span>
      </div>

      <div id="zoomControls" class="zoom" hidden>
        <button id="zoomOut" class="bar-button" type="button" aria-label="Zoom out">&#8722;</button>
        <span id="zoomLevel" class="zoom-level">100%</span>
        <button id="zoomIn" class="bar-button" type="button" aria-label="Zoom in">+</button>
      </div>
    </header>

    <!-- ------------------------------ PDF ------------------------------ -->
    <div id="pdfScroll" class="pdf-scroll" tabindex="0" hidden>
      <div id="pdfPages" class="pdf-pages"></div>
    </div>

    <!-- ----------------------------- Video ----------------------------- -->
    <div id="videoStage" class="video-stage" hidden>
      <video id="video" class="video" preload="metadata"></video>

      <div class="controls">
        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          value="0"
          step="0.05"
          aria-label="Seek">

        <div class="controls-row">
          <button id="playPause" class="bar-button" type="button">Play</button>
          <button id="back10" class="bar-button" type="button" aria-label="Back 10 seconds">&#8592; 10s</button>
          <button id="forward10" class="bar-button" type="button" aria-label="Forward 10 seconds">10s &#8594;</button>

          <p id="time" class="time">0:00 / 0:00</p>

          <div class="speed">
            <select id="speed" class="speed-select" aria-label="Playback speed">
              <option value="0.5">0.5&#215;</option>
              <option value="0.75">0.75&#215;</option>
              <option value="1" selected>1&#215;</option>
              <option value="1.25">1.25&#215;</option>
              <option value="1.5">1.5&#215;</option>
              <option value="1.75">1.75&#215;</option>
              <option value="2">2&#215;</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <p id="viewerStatus" class="viewer-status" role="status" aria-live="polite"></p>
  </section>

  <!-- ============================ Exit ============================= -->
  <div id="exitDialog" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <div class="sheet">
      <h2 id="exitTitle" class="sheet-title">Are you sure you want to exit?</h2>

      <div class="sheet-actions">
        <button id="goBack" class="ghost" type="button">Go Back</button>

        <div class="hold">
          <p id="holdCounter" class="hold-counter" role="status" aria-live="off">30 seconds</p>
          <button id="doExit" class="start start-inline" type="button">Exit</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="lockdown.js"></script>
</body>
</html>
